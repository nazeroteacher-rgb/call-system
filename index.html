<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호출 현황판</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #0f172a; color: #f1f5f9; padding: 32px;
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;}
  h1 { margin: 0; font-size: 26px; }
  #muteBtn { background: #1e293b; border: none; color: #f1f5f9; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-size: 15px;}
  #list { display: flex; flex-direction: column; gap: 12px; max-width: 800px; }
  .call-card {
    display: flex; align-items: center; justify-content: space-between;
    background: #1e293b; border-left: 6px solid #f97316; border-radius: 12px;
    padding: 18px 22px; animation: pop .25s ease;
  }
  @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .call-room { font-size: 22px; font-weight: 700; }
  .call-time { font-size: 14px; color: #94a3b8; margin-top: 4px; }
  .resolve-btn {
    background: #16a34a; border: none; color: white; padding: 10px 18px;
    border-radius: 10px; font-size: 15px; cursor: pointer;
  }
  .resolve-btn:hover { background: #15803d; }
  .away-btn {
    background: #475569; border: none; color: white; padding: 10px 16px;
    border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  .away-btn:hover { background: #334155; }
  .btn-group { display: flex; gap: 8px; }
  .empty { color: #64748b; text-align: center; margin-top: 60px; font-size: 18px; }
  .error { color: #f87171; text-align: center; margin-top: 60px; font-size: 16px; }
</style>
</head>
<body>
<header>
  <h1>📋 호출 현황판</h1>
  <div style="display:flex; gap:10px; align-items:center;">
    <a href="manage.html" style="color:#60a5fa; font-size:14px; text-decoration:none;">선생님 명단 관리 →</a>
    <button id="muteBtn" onclick="toggleMute()">🔊 소리 켜짐</button>
  </div>
</header>
<div id="soundHint" style="background:#f97316; color:white; padding:12px 18px; border-radius:10px; margin-bottom:16px; max-width:800px; font-size:16px; cursor:pointer;">🔔 소리를 켜려면 화면을 한 번 눌러주세요 (리모컨 확인 버튼)</div>
<div id="list"><div class="empty">불러오는 중...</div></div>

<script>
// ====== 여기에 본인의 Supabase 프로젝트 정보를 입력하세요 (README 참고) ======
const SUPABASE_URL = "https://bmixrutphsmokjmecagj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtaXhydXRwaHNtb2tqbWVjYWdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjYyMjEsImV4cCI6MjEwNDY0MjIyMX0.01EyU3EcUPyJZ6hq5YU90zcVFPquRybJkKUHobe1ZAs";
// ============================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let knownIds = new Set();
let firstLoad = true;
let muted = localStorage.getItem('callMuted') === '1';
updateMuteBtn();

function updateMuteBtn() {
  document.getElementById('muteBtn').textContent = muted ? '🔇 소리 꺼짐' : '🔊 소리 켜짐';
}
function toggleMute() {
  muted = !muted;
  localStorage.setItem('callMuted', muted ? '1' : '0');
  updateMuteBtn();
}

// ====== 선생님별 호출 음성(mp3) ======
// mp3 파일이 있는 폴더 (저장소 맨 위에 바로 올렸다면 '' 로 바꾸세요)
const VOICE_DIR = 'voice/';
const VOICE_FILES = {
  '구시은': 't01.mp3', '김경아': 't02.mp3', '김나영': 't03.mp3',
  '김미진': 't04.mp3', '김영일': 't05.mp3', '김윤정': 't06.mp3',
  '김한주': 't07.mp3', '류고운': 't08.mp3', '안효만': 't09.mp3',
  '엄숙용': 't10.mp3', '유중열': 't11.mp3', '이석기': 't12.mp3',
  '임은빈': 't13.mp3', '전은미': 't14.mp3', '최규환': 't15.mp3',
  '최지유': 't16.mp3', '한송희': 't17.mp3',
};

// 하나의 오디오 플레이어를 계속 재사용 (TV 브라우저에서 한 번 잠금 해제한 플레이어만 소리를 낼 수 있음)
const player = new Audio();
const voiceQueue = [];
let playing = false;

function playNext() {
  if (playing || voiceQueue.length === 0) return;
  playing = true;
  player.muted = false;
  player.src = voiceQueue.shift();
  player.play().catch(() => { playing = false; playNext(); });
}
player.addEventListener('ended', () => { playing = false; playNext(); });
player.addEventListener('error', () => { playing = false; playNext(); });

// 호출이 오면: mp3가 있으면 mp3 재생, 없으면(새로 추가된 선생님 등) 기존 TTS로 읽기
function speakTeacherName(name, subject) {
  if (muted) return;
  const file = VOICE_FILES[name];
  if (file) {
    voiceQueue.push(VOICE_DIR + file);
    playNext();
  } else {
    speakTTS(name, subject);
  }
}

// 브라우저 내장 음성 합성(TTS)으로 선생님 이름을 직접 불러줌 (PC용 예비 방식)
function speakTTS(name, subject) {
  try {
    const text = subject
      ? `${subject} 담당, ${name} 선생님, 호출입니다.`
      : `${name} 선생님, 호출입니다.`;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.rate = 1;
    utter.pitch = 1;
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

function timeAgo(iso) {
  const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? m + '분 ' + s + '초 전' : s + '초 전';
}

const AUTO_AWAY_MS = 5 * 60 * 1000; // 5분
const autoAwayInProgress = new Set();

async function refresh() {
  const { data, error } = await sb
    .from('calls')
    .select('*')
    .eq('resolved', false)
    .order('created_at', { ascending: true });

  const list = document.getElementById('list');

  if (error) {
    list.innerHTML = '<div class="error">⚠️ 연결 오류: ' + error.message + '<br>SUPABASE_URL / KEY 및 테이블 설정을 확인하세요.</div>';
    return;
  }

  // 호출된 지 5분이 지난 항목은 자동으로 '자리에 없음' 처리
  const now = Date.now();
  data.forEach(c => {
    const elapsed = now - new Date(c.created_at).getTime();
    if (elapsed >= AUTO_AWAY_MS && !autoAwayInProgress.has(c.id)) {
      autoAwayInProgress.add(c.id);
      markAway(c.id, c.teacher, true).finally(() => autoAwayInProgress.delete(c.id));
    }
  });

  const newCalls = data.filter(c => !knownIds.has(c.id));
  if (newCalls.length > 0 && !firstLoad) {
    newCalls.forEach(c => speakTeacherName(c.teacher, c.subject));
    document.title = '🔔 새 호출! - 호출 현황판';
  }
  knownIds = new Set(data.map(c => c.id));
  firstLoad = false;

  if (data.length === 0) {
    list.innerHTML = '<div class="empty">현재 호출이 없습니다</div>';
    document.title = '호출 현황판';
    return;
  }

  list.innerHTML = data.map(c => `
    <div class="call-card">
      <div>
        <div class="call-room">${c.teacher} 선생님${c.subject ? ' <span style="font-size:14px; color:#94a3b8; font-weight:400;">(' + c.subject + ')</span>' : ''}</div>
        <div class="call-time">${timeAgo(c.created_at)}</div>
      </div>
      <div class="btn-group">
        <button class="away-btn" onclick="markAway(${c.id}, '${c.teacher.replace(/'/g, "\\'")}')">자리에 없음</button>
        <button class="resolve-btn" onclick="resolveCall(${c.id})">완료</button>
      </div>
    </div>
  `).join('');
}

async function resolveCall(id) {
  await sb.from('calls').update({ resolved: true }).eq('id', id);
  refresh();
}

async function markAway(id, teacherName, isAuto) {
  const awayUntil = new Date(Date.now() + 5 * 60 * 1000).toISOString(); // 5분 후까지 부재중
  const [callRes, teacherRes] = await Promise.all([
    sb.from('calls').update({ resolved: true, away: true }).eq('id', id),
    sb.from('teachers').update({ away_until: awayUntil }).eq('name', teacherName)
  ]);
  if (callRes.error) console.error('호출 상태 업데이트 실패:', callRes.error.message);
  if (teacherRes.error) console.error('선생님 부재중 표시 실패:', teacherRes.error.message);
  if (!isAuto) refresh();
}

// 브라우저는 사용자가 페이지를 한 번 클릭하기 전까지 자동 음성 재생을 막는 경우가 많아,
// 첫 클릭 시 무음으로 한 번 실행해서 미리 "잠금 해제"해 둠
// (TV 리모컨의 확인 버튼은 keydown으로 들어올 수 있어서 둘 다 처리)
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  // mp3 플레이어 잠금 해제: 소리 없이 한 번 재생했다 멈춤
  if (!playing) {
    player.muted = true;
    player.src = VOICE_DIR + 't01.mp3';
    player.play().then(() => { player.pause(); player.currentTime = 0; player.muted = false; })
                 .catch(() => { player.muted = false; });
  }
  try {
    const unlockUtter = new SpeechSynthesisUtterance('');
    window.speechSynthesis.speak(unlockUtter);
  } catch (e) {}
  const hint = document.getElementById('soundHint');
  if (hint) hint.remove();
}
document.addEventListener('click', unlockAudio);
document.addEventListener('keydown', unlockAudio);

setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
