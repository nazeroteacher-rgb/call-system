<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호출 현황판</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #0f172a; color: #f1f5f9; padding: 32px;
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;}
  h1 { margin: 0; font-size: 26px; }
  #muteBtn { background: #1e293b; border: none; color: #f1f5f9; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-size: 15px;}
  #list { display: flex; flex-direction: column; gap: 12px; max-width: 800px; }
  .call-card {
    display: flex; align-items: center; justify-content: space-between;
    background: #1e293b; border-left: 6px solid #f97316; border-radius: 12px;
    padding: 18px 22px; animation: pop .25s ease;
  }
  @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .call-room { font-size: 22px; font-weight: 700; }
  .call-time { font-size: 14px; color: #94a3b8; margin-top: 4px; }
  .resolve-btn {
    background: #16a34a; border: none; color: white; padding: 10px 18px;
    border-radius: 10px; font-size: 15px; cursor: pointer;
  }
  .resolve-btn:hover { background: #15803d; }
  .away-btn {
    background: #475569; border: none; color: white; padding: 10px 16px;
    border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  .away-btn:hover { background: #334155; }
  .btn-group { display: flex; gap: 8px; }
  .empty { color: #64748b; text-align: center; margin-top: 60px; font-size: 18px; }
  .error { color: #f87171; text-align: center; margin-top: 60px; font-size: 16px; }
</style>
</head>
<body>
<header>
  <h1>📋 호출 현황판</h1>
  <div style="display:flex; gap:10px; align-items:center;">
    <a href="manage.html" style="color:#60a5fa; font-size:14px; text-decoration:none;">선생님 명단 관리 →</a>
    <button id="muteBtn" onclick="toggleMute()">🔊 소리 켜짐</button>
  </div>
</header>
<div id="list"><div class="empty">불러오는 중...</div></div>

<script>
// ====== 여기에 본인의 Supabase 프로젝트 정보를 입력하세요 (README 참고) ======
const SUPABASE_URL = "https://bmixrutphsmokjmecagj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtaXhydXRwaHNtb2tqbWVjYWdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjYyMjEsImV4cCI6MjEwNDY0MjIyMX0.01EyU3EcUPyJZ6hq5YU90zcVFPquRybJkKUHobe1ZAs";
// ============================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let knownIds = new Set();
let firstLoad = true;
let muted = localStorage.getItem('callMuted') === '1';
updateMuteBtn();

function updateMuteBtn() {
  document.getElementById('muteBtn').textContent = muted ? '🔇 소리 꺼짐' : '🔊 소리 켜짐';
}
function toggleMute() {
  muted = !muted;
  localStorage.setItem('callMuted', muted ? '1' : '0');
  updateMuteBtn();
}

// 브라우저 내장 음성 합성(TTS)으로 선생님 이름을 직접 불러줌
function speakTeacherName(name, subject) {
  if (muted) return;
  try {
    const text = subject
      ? `${subject} 담당, ${name} 선생님, 호출입니다.`
      : `${name} 선생님, 호출입니다.`;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ko-KR';
    utter.rate = 1;
    utter.pitch = 1;
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

function timeAgo(iso) {
  const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? m + '분 ' + s + '초 전' : s + '초 전';
}

async function refresh() {
  const { data, error } = await sb
    .from('calls')
    .select('*')
    .eq('resolved', false)
    .order('created_at', { ascending: true });

  const list = document.getElementById('list');

  if (error) {
    list.innerHTML = '<div class="error">⚠️ 연결 오류: ' + error.message + '<br>SUPABASE_URL / KEY 및 테이블 설정을 확인하세요.</div>';
    return;
  }

  const newCalls = data.filter(c => !knownIds.has(c.id));
  if (newCalls.length > 0 && !firstLoad) {
    newCalls.forEach(c => speakTeacherName(c.teacher, c.subject));
    document.title = '🔔 새 호출! - 호출 현황판';
  }
  knownIds = new Set(data.map(c => c.id));
  firstLoad = false;

  if (data.length === 0) {
    list.innerHTML = '<div class="empty">현재 호출이 없습니다</div>';
    document.title = '호출 현황판';
    return;
  }

  list.innerHTML = data.map(c => `
    <div class="call-card">
      <div>
        <div class="call-room">${c.teacher} 선생님${c.subject ? ' <span style="font-size:14px; color:#94a3b8; font-weight:400;">(' + c.subject + ')</span>' : ''}</div>
        <div class="call-time">${timeAgo(c.created_at)}</div>
      </div>
      <div class="btn-group">
        <button class="away-btn" onclick="markAway(${c.id})">자리에 없음</button>
        <button class="resolve-btn" onclick="resolveCall(${c.id})">완료</button>
      </div>
    </div>
  `).join('');
}

async function resolveCall(id) {
  await sb.from('calls').update({ resolved: true }).eq('id', id);
  refresh();
}

async function markAway(id) {
  await sb.from('calls').update({ resolved: true, away: true }).eq('id', id);
  refresh();
}

// 브라우저는 사용자가 페이지를 한 번 클릭하기 전까지 자동 음성 재생을 막는 경우가 많아,
// 첫 클릭 시 무음으로 한 번 실행해서 미리 "잠금 해제"해 둠
let audioUnlocked = false;
document.addEventListener('click', () => {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try {
    const unlockUtter = new SpeechSynthesisUtterance('');
    window.speechSynthesis.speak(unlockUtter);
  } catch (e) {}
}, { once: true });

setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
